<section class="slide" id="slide-17b" data-sid="17-warmup-q2-cont:1">
  <header class="slide__head" data-sid="17-warmup-q2-cont:2">
    <p class="slide__kicker" data-sid="17-warmup-q2-cont:3">Warm-up · Q2 · Answer</p>
    <h2 data-sid="17-warmup-q2-cont:4">One object — set it once</h2>
  </header>
  <div class="slide__body grid grid--2" data-sid="17-warmup-q2-cont:5">
    <div class="stack" data-sid="17-warmup-q2-cont:6">
      <figure class="refs" data-sid="17-warmup-q2-cont:7">
        <div class="refs__var" data-sid="17-warmup-q2-cont:8">e1</div>
        <div class="refs__obj refs__obj--shared" data-sid="17-warmup-q2-cont:9">
          <div class="refs__type" data-sid="17-warmup-q2-cont:10">Employee</div>
          <div class="refs__field" data-sid="17-warmup-q2-cont:11">id = 456</div>
        </div>
        <div class="refs__var" data-sid="17-warmup-q2-cont:12">e2</div>
        <figcaption data-sid="17-warmup-q2-cont:13">Line 5 left one object with two names — nothing new to create.</figcaption>
      </figure>
      <article class="tile tile--a2" data-sid="17-warmup-q2-cont:14">
        <p class="tile__label" data-sid="17-warmup-q2-cont:15">Why one line is enough</p>
        <p data-sid="17-warmup-q2-cont:16">e1 and e2 are two handles on the same Employee. Writing through either one changes what both read.</p>
      </article>
    </div>
    <div class="stack" data-sid="17-warmup-q2-cont:17">
      <figure class="editor frag" data-step="1" data-sid="17-warmup-q2-cont:18">
        <figcaption class="editor__bar" data-sid="17-warmup-q2-cont:19">✓ your answer — one line</figcaption>
        <ol class="editor__code" data-sid="17-warmup-q2-cont:20">
          <li data-sid="17-warmup-q2-cont:21">e1.setID(<span class="tok-num">789</span>);</li>
        </ol>
      </figure>
      <figure class="refs frag" data-step="2" data-sid="17-warmup-q2-cont:22">
        <div class="refs__var" data-sid="17-warmup-q2-cont:23">e1</div>
        <div class="refs__obj refs__obj--shared refs__obj--changed" data-sid="17-warmup-q2-cont:24">
          <div class="refs__type" data-sid="17-warmup-q2-cont:25">Employee</div>
          <div class="refs__field" data-sid="17-warmup-q2-cont:26">id = 789</div>
        </div>
        <div class="refs__var" data-sid="17-warmup-q2-cont:27">e2</div>
        <figcaption data-sid="17-warmup-q2-cont:28">Both names now read 789.</figcaption>
      </figure>
    </div>
  </div>
  <p class="note frag" data-step="3" data-sid="17-warmup-q2-cont:29">In Q1 sharing was the problem. Here sharing is the point.</p>
